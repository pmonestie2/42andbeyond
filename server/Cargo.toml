[package]
name = "beyond-server"
version = "0.1.0"
edition = "2021"
description = "Portable Earth and Beyond development server"

[[bin]]
name = "beyond-server"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
pbkdf2 = "0.12"
sha2 = "0.10"

[profile.release]
lto = "thin"
